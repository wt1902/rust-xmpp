[package]
name = "rust-xmpp"
version = "0.8.2"
edition = "2024"
description = "Experimental Rust XMPP server with Prosody-compatible storage"
license = "MIT"

[dependencies]
anyhow = "1"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.9"
glob = "0.3"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
roxmltree = "0.21"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
hex = "0.4"
subtle = "2"
stringprep = "0.1"
uuid = { version = "1", features = ["v4"] }

chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }

socket2 = "0.6"

hickory-resolver = { version = "0.24", features = ["tokio-runtime", "system-config"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
